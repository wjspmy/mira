name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build & Release (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build & upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Mira ${{ github.ref_name }}
          releaseBody: |
            ## Windows 安装包

            - `Mira_*_x64-setup.exe`：NSIS 安装程序
            - `Mira_*_x64_en-US.msi`：MSI 安装程序
            - `Mira_*_x64-portable.exe`：免安装，下载后直接运行

            详细变更请查看 Git 提交记录。
          releaseDraft: true
          prerelease: false
          args: --target x86_64-pc-windows-msvc

      - name: Prepare portable exe
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          Copy-Item "src-tauri/target/x86_64-pc-windows-msvc/release/mira.exe" "Mira_${ver}_x64-portable.exe"

      - name: Upload portable exe
        uses: softprops/action-gh-release@v2
        with:
          files: Mira_*_x64-portable.exe
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
